[project]
name = "live-pulse-scripts"
version = "0.1.0"
description = "Auxiliary Python tooling for Live Pulse: generators, seeding, concurrency repros, load tests, analysis."
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",          # event generator -> Kafka
    "aio-pika>=9.4",           # RabbitMQ retries / DLQ tests
    "psycopg[binary]>=3.2",    # seeding with COPY
    "httpx>=0.27",             # concurrency repros against the API
    "locust>=2.31",            # load testing
    "matplotlib>=3.9",         # result charts
    "typer>=0.12",             # CLI entry points
]

[project.optional-dependencies]
grpc = ["grpcio>=1.66", "grpcio-tools>=1.66"]   # Stage 5 only

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
