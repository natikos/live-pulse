# Live Pulse infrastructure.
#
#   docker compose up -d                          # core: postgres, redis, kafka, prometheus, grafana, kafka-exporter
#   docker compose --profile rabbit up -d         # + RabbitMQ (Stage 2b)
#   docker compose --profile tracing up -d        # + Jaeger (Stage 4/5)
#   docker compose --profile rabbit --profile tracing up -d   # everything
#
# Application containers (NestJS apps, nginx) are added in later stages.

name: live-pulse

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livepulse}
      POSTGRES_DB: ${POSTGRES_DB:-livepulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Host clients use localhost:9092, containers use kafka:29092.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *hc
      start_period: 30s
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]

  # Exposes consumer lag and topic/partition metrics for Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]

  grafana:
    image: grafana/grafana:13.0.11
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]

  # --- profile: rabbit -------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.6-management
    profiles: ["rabbit"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-livepulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-livepulse}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"   # management UI
      - "15692:15692"                        # prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *hc
      start_period: 30s
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  # --- profile: tracing ------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # UI
      - "4317:4317"                        # OTLP gRPC
      - "4318:4318"                        # OTLP HTTP
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]

  # --- profile: scaling (Stage 4) -------------------------------------------
  # Uncomment when the app runs in containers; upstreams go in infra/nginx/nginx.conf.
  # nginx:
  #   image: nginx:1.30.6-alpine
  #   profiles: ["scaling"]
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
