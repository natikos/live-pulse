name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Same image tag as the postgres services in docker-compose.yml; keep them in sync.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: livepulse
          POSTGRES_PASSWORD: livepulse
          POSTGRES_DB: livepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livepulse -d livepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install -g npm@12.2.0
        working-directory: .
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
        env:
          # Use the service container above instead of starting one via Docker.
          E2E_EXTERNAL_DB: "1"
          DATABASE_URL: postgresql://livepulse:livepulse@localhost:5432/livepulse_test
          # Required by config.ts at startup; the e2e tests do not connect to them yet.
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
      - run: npm run build
      # openapi.json is committed; fail when the API changed and it was not re-exported.
      - run: npm run openapi:export
        env:
          DATABASE_URL: postgresql://livepulse:livepulse@localhost:5432/livepulse_test
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
      - run: git diff --exit-code -- openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # schema.d.ts is committed; fail when it is stale against server/openapi.json.
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/schema.d.ts

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock
      # The Python version comes from requires-python in pyproject.toml.
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
